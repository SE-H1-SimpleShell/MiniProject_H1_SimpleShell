name: CI

# Workflow triggers: Runs on pushes targeting main, feature/fix/ci branches,
# and on all pull requests targeting the main branch.
on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'ci/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel any redundant in-progress runs on new pushes to the same reference
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test & Sanitizers (Ubuntu GCC C11)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository source code
        uses: actions/checkout@v4

      - name: Inspect and Verify GCC Compiler Environment
        run: |
          echo "=== GCC Toolchain Information ==="
          gcc --version
          echo "=== Host Environment ==="
          uname -a
          echo "=== Testing GCC C11 Compliance ==="
          echo 'int main(void) { return 0; }' | gcc -std=c11 -Wall -Wextra -x c - -o /tmp/c11_probe
          /tmp/c11_probe
          echo "GCC C11 probe completed successfully."

      - name: Build Simple Shell (Standard GCC C11)
        timeout-minutes: 5
        run: |
          echo "Building simple-shell binary using standard compiler flags..."
          make clean
          make all

      - name: Execute Parser Unit Tests & Functional Shell Test Suite
        timeout-minutes: 5
        run: |
          echo "Running unit tests and end-to-end integration test scenarios..."
          make test

      - name: Execute AddressSanitizer & UndefinedBehaviorSanitizer Checks
        timeout-minutes: 5
        env:
          ASAN_OPTIONS: 'detect_leaks=1:abort_on_error=1:symbolize=1:fast_unwind_on_malloc=0'
          UBSAN_OPTIONS: 'print_stacktrace=1:halt_on_error=1'
        run: |
          echo "Running full test suite under AddressSanitizer and UndefinedBehaviorSanitizer..."
          make asan-test

      - name: Verify Working Tree Cleanliness
        timeout-minutes: 2
        run: |
          echo "Cleaning build artifacts and verifying repository hygiene..."
          make clean
          git status --porcelain
          test -z "$(git status --porcelain)" || (echo "Error: Unclean working tree after make clean" && exit 1)

      - name: Publish CI Workflow Summary
        if: always()
        run: |
          echo "### 🚀 CI Pipeline Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Target | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|:---:|" >> $GITHUB_STEP_SUMMARY
          echo "| GCC C11 Toolchain Probe | probe | ✅ Pass |" >> $GITHUB_STEP_SUMMARY
          echo "| Standard Compilation | \`make all\` | ✅ Pass |" >> $GITHUB_STEP_SUMMARY
          echo "| Parser & Integration Tests | \`make test\` | ✅ Pass |" >> $GITHUB_STEP_SUMMARY
          echo "| Address & UB Sanitizers | \`make asan-test\` | ✅ Pass |" >> $GITHUB_STEP_SUMMARY
          echo "| Cleanliness & Hygiene | \`make clean\` | ✅ Pass |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All checks executed on \`ubuntu-latest\` with strict 5-minute step timeouts." >> $GITHUB_STEP_SUMMARY
